name: build

# CI starter: every push and PR gets a clean Release build against the pinned
# Rock NuGet floor. Tag pushes (v*) also upload the DLL as a release artifact,
# so the exact binary that ships is the one CI built.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write   # the release step creates the GitHub release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (Release)
        run: dotnet build com.yesuchum.Cairn.FollowingEvents.csproj -c Release -v minimal

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.yesuchum.Cairn.FollowingEvents
          path: bin/Release/net472/com.yesuchum.Cairn.FollowingEvents.dll

      - name: Attach DLL to release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/net472/com.yesuchum.Cairn.FollowingEvents.dll
